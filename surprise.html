<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tu as gagné quelque chose</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#1a0a2e; --plum:#3a1360; --rose:#ff8fb8; --gold:#f5c76a; --ice:#9fd8ff; --text:#fff3e6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);overflow:hidden;position:relative}
.aurora{position:fixed;inset:-20%;z-index:0;filter:blur(70px);opacity:.75;
  background:radial-gradient(40% 40% at 25% 30%,var(--plum),transparent 70%),
             radial-gradient(35% 35% at 75% 70%,#5b1f6e,transparent 70%),
             radial-gradient(30% 30% at 70% 20%,#14336b,transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.08)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
section{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
body[data-s="intro"] #intro,body[data-s="win"] #win,body[data-s="pick"] #pick{opacity:1;visibility:visible}

/* Ticket */
.ticket{position:relative;width:min(86vw,440px);padding:44px 28px;border:0;cursor:pointer;color:#2a1240;font-family:var(--display);
  background:linear-gradient(115deg,#d9a441 0%,#ffe9a8 28%,#f5c76a 48%,#fff2c4 62%,#d9a441 100%);background-size:250% 100%;
  animation:shine 3.6s linear infinite,bob 4s ease-in-out infinite;
  -webkit-mask:radial-gradient(circle 16px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 16px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  filter:drop-shadow(0 0 28px rgba(245,199,106,.45));transition:transform .5s cubic-bezier(.6,-.3,.4,1.4),opacity .5s}
.ticket:focus-visible{outline:3px solid var(--ice);outline-offset:6px}
.ticket small{display:block;font:600 .8rem var(--body);letter-spacing:.04em;margin-bottom:14px}
.ticket b{display:block;font-weight:800;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.1}
.ticket span{display:block;margin-top:18px;font:600 .95rem var(--body)}
.ticket.open{transform:scale(1.5) rotate(-4deg);opacity:0}
@keyframes shine{to{background-position:-250% 0}}
@keyframes bob{50%{translate:0 -10px}}

/* Texte */
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,4.6rem);line-height:1.05;max-width:14ch;
  background:linear-gradient(100deg,var(--gold),#fff6d8 40%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px) scale(.8);filter:blur(8px)}
body[data-s="win"] h1 .w{animation:pop .8s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i)*.14s + .3s)}
@keyframes pop{to{opacity:1;transform:none;filter:none}}
.lead{margin-top:22px;max-width:34ch;font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.5;opacity:.92}
.btn{margin-top:30px;border:0;cursor:pointer;font:800 1rem var(--display);padding:18px 30px;border-radius:999px;color:#2a1240;
  background:linear-gradient(120deg,var(--gold),var(--rose));box-shadow:0 10px 30px rgba(255,143,184,.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:focus-visible{outline:3px solid var(--ice);outline-offset:4px}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px rgba(255,243,230,.4);font-size:.85rem;padding:12px 22px;margin-top:18px}

/* Cartes */
.hint{font-family:var(--display);font-weight:500;font-size:clamp(1rem,3.6vw,1.4rem);margin-bottom:26px;max-width:24ch;line-height:1.3}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,32px);width:min(94vw,900px);perspective:1100px}
.tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,opacity .6s,filter .6s}
.card{position:relative;width:100%;aspect-ratio:3/4;border:0;padding:0;cursor:pointer;background:none;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.3,1.2,.4,1);color:inherit;font:inherit;animation:float 5s ease-in-out infinite;animation-delay:calc(var(--k)*-1.4s)}
@keyframes float{50%{translate:0 -9px}}
.card:focus-visible{outline:3px solid var(--ice);outline-offset:6px;border-radius:22px}
.face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.35)}
.front i{font-style:normal;font-size:clamp(2.2rem,9vw,4.4rem);color:#2a1240;opacity:.85}
.front em{font:normal 600 clamp(.75rem,2.4vw,.95rem) var(--body);color:#2a1240}
.back{transform:rotateY(180deg);background:var(--night);box-shadow:0 0 0 2px var(--c1),0 0 50px var(--c1);color:var(--text)}
.back strong{font:800 clamp(.9rem,3.2vw,1.35rem) var(--display);color:var(--c1);line-height:1.15}
.back p{font-size:clamp(.78rem,2.5vw,1rem);line-height:1.4;opacity:.92}
.card.flip{transform:rotateY(180deg);animation:none}
.cards.done .tilt:not(.chosen){opacity:.18;filter:blur(3px) saturate(.4);pointer-events:none}
.cards.done .tilt.chosen{transform:scale(1.08)}
.after{min-height:84px;margin-top:22px}
.after p{font-family:var(--display);font-weight:500;font-size:1.05rem;opacity:0;transition:opacity .8s .6s}
.done+.after p{opacity:1}

@media (max-width:640px){
  .cards{grid-template-columns:1fr;width:min(88vw,380px);gap:14px}
  .card{aspect-ratio:auto;height:128px}
  .face{flex-direction:row;gap:16px;padding:16px 20px;text-align:left}
  .back{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
  .hint{margin-bottom:18px}
}
@media (prefers-reduced-motion:reduce){
  .aurora,.ticket,.card{animation:none!important}
  body[data-s="win"] h1 .w{animation-duration:.01s;animation-delay:0s}
  .tilt,.card{transition-duration:.01s}
}
</style>
</head>
<body data-s="intro">
<div class="aurora" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>

<section id="intro">
  <button class="ticket" id="ticket" aria-label="Ouvrir le billet">
    <small>Un billet est arrivé pour toi</small>
    <b>Billet gagnant</b>
    <span>Touche pour l’ouvrir</span>
  </button>
</section>

<section id="win">
  <h1 id="title" aria-label=""></h1>
  <p class="lead">Tu viens de gagner un prix. Trois surprises t’attendent, mais tu n’as le droit d’en ouvrir qu’une seule.</p>
  <button class="btn" id="go">Voir les surprises</button>
</section>

<section id="pick">
  <p class="hint" id="hint">Choisis bien. Une seule carte, et c’est définitif.</p>
  <div class="cards" id="cards"></div>
  <div class="after"><p id="done">Ton choix est fait. Profite bien.</p><button class="btn ghost" id="again" hidden>Recommencer</button></div>
</section>

<script>
/* === À PERSONNALISER === */
const CONFIG = {
  name: "Jade,",              // ex. "Bravo Léa"
  headline: "tu as gagné !",
  surprises: [
    { glyph:"✦", label:"La rose",   c1:"#ff8fb8", c2:"#ffc9dc", title:"Un restaurant",   text:"Tu choisis le restaurant que tu veux. Je t’y emmène." },
    { glyph:"◆", label:"La dorée",  c1:"#f5c76a", c2:"#ffe9a8", title:"Soirée cinéma",  text:"Film, pop-corn et un petit cadeau à la fin de la soirée." },
    { glyph:"●", label:"La glacée", c1:"#9fd8ff", c2:"#d6efff", title:"Chez Zara", text:"Un vêtement de ton choix. Un seul, alors choisis bien." }
  ]
};
/* ======================= */

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const cv = $("fx"), ctx = cv.getContext("2d");
let parts = [], raf = null, W = 0, H = 0;
function size(){ const d = Math.min(devicePixelRatio||1,2); W = cv.width = innerWidth*d; H = cv.height = innerHeight*d; }
addEventListener("resize", size); size();

function burst(x, y, n){
  const d = Math.min(devicePixelRatio||1,2), cols = ["#f5c76a","#ff8fb8","#9fd8ff","#fff3e6","#c08bff"];
  n = reduce ? Math.round(n/4) : n;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (4+Math.random()*13)*d;
    parts.push({x:x*d,y:y*d,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6*d,w:(5+Math.random()*7)*d,h:(8+Math.random()*10)*d,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,W,H);
  parts.forEach(p=>{
    p.vy += .32*(devicePixelRatio>1?2:1)*.7; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    ctx.save(); ctx.globalAlpha = Math.max(p.life,0); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  parts = parts.filter(p=>p.life>0 && p.y<H+60);
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!raf) ctx.clearRect(0,0,W,H);
}

/* Titre mot par mot */
const t = $("title");
const words = (CONFIG.name + " " + CONFIG.headline).split(" ");
t.setAttribute("aria-label", words.join(" "));
words.forEach((w,i)=>{ const s=document.createElement("span"); s.className="w"; s.style.setProperty("--i",i); s.textContent=w+" "; s.setAttribute("aria-hidden","true"); t.appendChild(s); });

/* Cartes */
const cards = $("cards");
CONFIG.surprises.forEach((s,k)=>{
  const wrap = document.createElement("div"); wrap.className="tilt";
  const b = document.createElement("button"); b.className="card"; b.style.setProperty("--k",k);
  b.style.setProperty("--c1",s.c1); b.style.setProperty("--c2",s.c2);
  b.setAttribute("aria-label","Ouvrir la surprise : "+s.label);
  const f = document.createElement("div"); f.className="face front";
  const g = document.createElement("i"); g.textContent=s.glyph; const l = document.createElement("em"); l.textContent=s.label; f.append(g,l);
  const bk = document.createElement("div"); bk.className="face back";
  const h = document.createElement("strong"); h.textContent=s.title; const p = document.createElement("p"); p.textContent=s.text; bk.append(h,p);
  b.append(f,bk); wrap.appendChild(b); cards.appendChild(wrap);
  wrap.addEventListener("pointermove",e=>{
    if(reduce||cards.classList.contains("done")||e.pointerType==="touch") return;
    const r = wrap.getBoundingClientRect();
    wrap.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*22+"deg");
    wrap.style.setProperty("--rx",(-((e.clientY-r.top)/r.height-.5))*22+"deg");
  });
  wrap.addEventListener("pointerleave",()=>{wrap.style.setProperty("--rx","0deg");wrap.style.setProperty("--ry","0deg");});
  b.addEventListener("click",()=>choose(wrap,b,s));
});

function choose(wrap,b,s){
  if(cards.classList.contains("done")) return;
  cards.classList.add("done"); wrap.classList.add("chosen"); b.classList.add("flip");
  wrap.style.setProperty("--rx","0deg"); wrap.style.setProperty("--ry","0deg");
  $("hint").textContent = "Voilà ce que tu as choisi.";
  setTimeout(()=>{ const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,160); },450);
  setTimeout(()=>{ $("again").hidden=false; },1600);
}

/* Enchaînement */
$("ticket").addEventListener("click",()=>{
  $("ticket").classList.add("open");
  $("flash").classList.add("go");
  burst(innerWidth/2,innerHeight/2,220);
  setTimeout(()=>{ document.body.dataset.s="win"; },450);
});
$("go").addEventListener("click",()=>{ document.body.dataset.s="pick"; });
$("again").addEventListener("click",()=>{
  cards.classList.remove("done"); document.querySelectorAll(".tilt").forEach(w=>w.classList.remove("chosen"));
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("flip"));
  $("hint").textContent="Choisis bien. Une seule carte, et c’est définitif."; $("again").hidden=true;
});
</script>
</body>
</html>
